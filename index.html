    ['hp','atk','def','spd','eva'].forEach(k=> p[k]=Math.max(1, p[k]-selfDown));
    logMsg(`${p.name}の${sk.name}！ ${e.name}に${dmg}の大ダメージ！ 代償として自分の全ステータスが${selfDown}下がった！`);
    return {target:'enemy', dmg, crit:true};
  }
  return {target:null};
}

function resolveEnemyAction(bs, action){
  const p = bs.player, e = bs.enemy;
  if(e.hp<=0) return {target:null};
  const confuseResult = checkConfuse(bs, 'enemy');
  if(confuseResult) return confuseResult;
  if(action.type==='attack'){
    if(!tryHit(e.acc, p.eva)){ logMsg(`${e.name}のこうげきは外れた！`); return {target:'player', missed:true}; }
    const dmg = basicDamage(e.atk, p.def);
    if(p.reflectTurns>0){
      p.reflectTurns--;
      e.hp -= dmg;
      logMsg(`${p.name}はプルプル状態！ ${e.name}のこうげきを跳ね返した！ ${e.name}に${dmg}のダメージ！`);
      return {target:'enemy', dmg};
    }
    p.hp -= dmg;
    logMsg(`${e.name}のこうげき！ ${p.name}に${dmg}のダメージ！`);
    return {target:'player', dmg};
  }
  const sk = action.skill;
  sk.cdLeft = sk.cd; sk.usedOnce = true;
  switch(sk.type){
    case 'debuff_enemy':
      p[sk.stat] = Math.max(1, Math.round(p[sk.stat]*sk.mult));
      logMsg(`${e.name}は${sk.name}を使った！ ${p.name}は弱体化した！`);
      return {target:'player', buff:true, skillName:sk.name};
    case 'buff_self':
      e[sk.stat] = Math.round(e[sk.stat]*sk.mult);
      logMsg(`${e.name}は${sk.name}を使った！ 自身を強化した！`);
      return {target:'enemy', buff:true, skillName:sk.name};
    case 'debuff_enemy_random':{
      const stat = pick(['atk','def','spd']);
      p[stat] = Math.max(1, Math.round(p[stat]*sk.mult));
      logMsg(`${e.name}の${sk.name}！ ${p.name}の${statKeyLabel(stat)}が大きく下がった！`);
      return {target:'player', buff:true, skillName:sk.name};
    }
    case 'magic_dmg':{
      const mag = Math.round((e.atk + e.spd*1.5) * sk.mult);
      const dmg = Math.max(1, Math.round(mag - p.def*0.3));
      p.hp -= dmg;
      logMsg(`${e.name}の${sk.name}！ 魔力の一撃で${dmg}のダメージ！`);
      return {target:'player', dmg, crit:true};
    }
    case 'dmg_debuff':{
      const dmg = Math.max(1, Math.round(e.atk*sk.dmgMult - p.def*0.4));
      p.hp -= dmg;
      p[sk.stat] = Math.max(1, Math.round(p[sk.stat]*sk.mult));
      logMsg(`${e.name}の${sk.name}！ ${dmg}のダメージと${statKeyLabel(sk.stat)}低下！`);
      return {target:'player', dmg};
    }
    case 'big_dmg':{
      const dmg = Math.max(1, Math.round(e.atk*sk.mult - p.def*0.3));
      p.hp -= dmg;
      logMsg(`${e.name}の${sk.name}！ ${dmg}の大ダメージ！`);
      return {target:'player', dmg, crit:true};
    }
    case 'debuff_all_big':
      ['atk','def','spd','eva'].forEach(k=> p[k]=Math.max(1,Math.round(p[k]*sk.mult)));
      logMsg(`${e.name}の${sk.name}！ ${p.name}の全ステータスが大幅に下がった！`);
      return {target:'player', buff:true, skillName:sk.name};
  }
  return {target:null};
}

function tickCooldowns(bs){
  Object.keys(bs.player.cds).forEach(k=>{ if(bs.player.cds[k]>0) bs.player.cds[k]--; });
  bs.enemy.skills.forEach(s=>{ if(s.cdLeft>0) s.cdLeft--; });
  [bs.player, bs.enemy].forEach(unit=>{
    if(unit.status && unit.status.poison>0 && unit.hp>0){
      const dmg = Math.max(1, Math.round(unit.maxHp*0.07));
      unit.hp -= dmg;
      unit.status.poison--;
      logMsg(`${unit.name}は毒のダメージを受けた！ ${dmg}のダメージ！`);
    }
  });
}

function finishBattle(){
  const bs = battleState;
  clearTimeout(bs.timer);
  const stage = bs.stage;

  if(stage.type==='hunt'){
    battleState = null;
    if(bs.win){
      account.huntWins += 1;
      const medalPrize = Math.round(stage.rarity.mult * 15);
      account.medals += medalPrize;
      toast(`ハント成功！ 🪙+${medalPrize}`);
    }else{
      toast('ハント失敗…また挑戦しよう');
    }
    saveAccount();
    render();
    return;
  }

  if(bs.win){
    /* コロシアムメダルはボス討伐後のみ獲得できる（ミニ討伐は0枚） */
    const medalGain = stage.type==='F' ? 150 : (stage.type==='B' ? 25+stage.world*8 : 0);
    const heartGain = stage.type==='F'?0:(stage.type==='B'?rnd(3,6):rnd(1,3));
    if(medalGain>0){ account.medals += medalGain; saveAccount(); }
    S.hearts += heartGain;
    if(stage.type==='B' || stage.type==='F'){
      const baseBonus = stage.type==='F' ? 20 : (1+stage.world);
      const bonus = bs.devilPact ? baseBonus*3 : baseBonus;
      ['hp','atk','def','spd','eva'].forEach(k=> S.stats[k] += bonus);
    }
    markCleared(stage);
    battleState = null;
    if(stage.type==='F'){ S.ending=true; saveGame(); render(); return; }
    advanceStage();
    saveGame();
    toast(`勝利！${medalGain?` 🪙+${medalGain}`:''}${heartGain?` 💗+${heartGain}`:''}`);
  }else{
    battleState = null;
    if(stage.type==='M' || stage.type==='B' || stage.type==='F'){
      S.lives = Math.max(0, S.lives-1);
      if(S.lives<=0){
        S.gameOver = true;
        saveGame();
        render();
        return;
      }
    }
    /* 火山・コロシアム（world 6・7）では、同じ育成地点への「負けて戻る」リトライは一度きり。
       これを外すと、リトライチケット＋ライフを使って後半の高倍率トレーニングを
       無限に周回できてしまう不具合があったための対策。 */
    const isLateGame = (stage.world===6 || stage.world===7);
    if(isLateGame && S.lateGameRetryUsedFor===S.checkpoint){
      toast('この地では、同じ育成地点への後戻りは一度きり…気を引き締めてもう一度！');
    }else{
      if(isLateGame) S.lateGameRetryUsedFor = S.checkpoint;
      S.stageIndex = S.checkpoint;
    }
    saveGame();
  }
  render();
}

/* =========================================================================
   レーティングマッチ：5体（Bot4体＋自分1体）が入り乱れる簡易バトルロイヤル
   ========================================================================= */
let ratingBattleState = null;

function buildRatingCombatant(entry, isPlayer){
  const s = entry.stats;
  return {
    id: entry.id, name: entry.name,
    mon: STARTERS[entry.speciesId] || {shape:'kaiju', colorA:'#888', colorB:'#444'},
    speciesId: entry.speciesId,
    hp: s.hp, maxHp: s.hp, atk: s.atk, def: s.def, spd: s.spd, eva: s.eva, acc:0,
    status:{poison:0, confuse:0}, cds:{}, usedBuffs:[],
    magicMod:1, reflectTurns:0, chargingTurns:0,
    skills: isPlayer ? skillsForRating(entry.speciesId) : entry.skills,
    basePower: computePower(s),
    isPlayer, alive:true,
  };
}
function startRatingBattle(myEntry, bots){
  const combatants = [ buildRatingCombatant(myEntry, true) ];
  bots.forEach(b=> combatants.push(buildRatingCombatant(b, false)));
  /* 横一列の並び順は開始時点のすばやさ順で固定（バトル中の変動で並びがグチャグチャにならないように） */
  const displayOrder = [...combatants].sort((a,b)=> b.spd-a.spd).map(c=>c.id);
  ratingBattleState = {
    combatants, displayOrder, log:['レーティングマッチ開始！ 5体が入り乱れる！'],
    over:false, result:null, eliminationOrder:[],
    fx:null, speed:1, timer:null, skipped:false, winBannerScheduled:false,
  };
  render();
  ratingBattleState.timer = setTimeout(ratingAutoLoop, 1000);
}
function aliveCombatants(bs){ return bs.combatants.filter(c=>c.alive); }
function logRatingMsg(bs, m){ bs.log.push(m); if(bs.log.length>60) bs.log.shift(); }
function killCombatant(bs, c){
  if(!c.alive) return;
  c.alive=false; c.hp=0;
  bs.eliminationOrder.push(c.id);
  logRatingMsg(bs, `${c.name}は倒れた！`);
}
function ratingCheckConfuse(bs, actor){
  if(!actor.status || actor.status.confuse<=0) return null;
  actor.status.confuse--;
  if(Math.random()<0.4){
    const dmg = Math.max(1, Math.round(actor.atk*0.5 - actor.def*0.3));
    actor.hp -= dmg;
    logRatingMsg(bs, `${actor.name}は混乱している… 自分を攻撃してしまった！ ${dmg}のダメージ！`);
    if(actor.hp<=0) killCombatant(bs, actor);
    return {actor:actor.id, target:actor.id, dmg, confused:true};
  }
  return null;
}
function ratingDecideAction(bs, actor){
  const others = aliveCombatants(bs).filter(c=>c.id!==actor.id);
  if(others.length===0) return null;
  const target = pick(others);
  const usable = (actor.skills||[]).filter(key=>{
    const sk = SKILLS[key];
    if(!sk) return false;
    const used = actor.usedBuffs.includes(key);
    const cdLeft = actor.cds[key]||0;
    if(cdLeft>0) return false;
    if(!REPEATABLE_SKILL_KINDS.includes(sk.kind) && used) return false;
    return true;
  });
  if(usable.length && Math.random()<0.4){ return {type:'skill', key:pick(usable), target}; }
  return {type:'attack', target};
}
function ratingApplySkill(bs, actor, target, sk, key){
  if(sk.kind==='buff'){
    actor[sk.stat] = Math.round(actor[sk.stat]*sk.mult);
    if(sk.sideStat) actor[sk.sideStat] = Math.round(actor[sk.sideStat]*sk.sideMult);
    actor.usedBuffs.push(key);
    logRatingMsg(bs, `${actor.name}は${sk.name}を使った！`);
    return {actor:actor.id, target:actor.id, buff:true, skillName:sk.name};
  }
  if(sk.kind==='debuff'){
    if(!tryHit(actor.acc, target.eva)){ logRatingMsg(bs, `${actor.name}の${sk.name}は外れた！`); return {actor:actor.id, target:target.id, missed:true}; }
    if(sk.stat==='acc'){ target.acc=(target.acc||0)-0.5; } else { target[sk.stat]=Math.max(1,Math.round(target[sk.stat]*sk.mult)); }
    actor.usedBuffs.push(key);
    logRatingMsg(bs, `${actor.name}は${sk.name}を使った！ ${target.name}は弱体化した！`);
    return {actor:actor.id, target:target.id, buff:true, skillName:sk.name};

    const met = sk.cond==='low' ? ratio<=0.35 : ratio>=0.6;
    const dmg = met ? Math.max(1,Math.round(actor.atk*sk.mult - target.def*0.35)) : basicDamage(Math.round(actor.atk*.6), target.def);
    target.hp -= dmg;

    if(target.hp<=0) killCombatant(bs, target);
    return {actor:actor.id, target:target.id, dmg, crit:met};
  }
  if(sk.kind==='status'){
    actor.cds[key]=3;
    if(!tryHit(actor.acc, target.eva)){ logRatingMsg(bs, `${actor.name}の${sk.name}は外れた！`); return {actor:actor.id, target:target.id, missed:true}; }

    return {actor:actor.id, target:target.id, buff:true, skillName:sk.name};
  }
  if(sk.kind==='dmg_debuff'){
    actor.cds[key]=3;
    if(!tryHit(actor.acc, target.eva)){ logRatingMsg(bs, `${actor.name}の${sk.name}は外れた！`); return {actor:actor.id, target:target.id, missed:true}; }
    const dmg = Math.max(1, Math.round(actor.atk*sk.dmgMult - target.def*0.3));
    target.hp -= dmg;
    target[sk.stat] = Math.max(1, Math.round(target[sk.stat]*sk.mult));
    logRatingMsg(bs, `${sk.name}が命中！ ${target.name}に${dmg}のダメージ！`);
    if(target.hp<=0) killCombatant(bs, target);
    return {actor:actor.id, target:target.id, dmg, crit:true};
  }
  if(sk.kind==='roulette'){
    actor.cds[key]=4;
    if(!tryHit(actor.acc, target.eva)){ logRatingMsg(bs, `${actor.name}の${sk.name}は外れた！`); return {actor:actor.id, target:target.id, missed:true}; }
    const outcome = pick(AI_ROULETTE);
    outcome.apply(target);
    logRatingMsg(bs, `${actor.name}は${sk.name}を発動！「${outcome.label}」！`);
    logRatingMsg(bs, outcome.msg(target.name));
    if(target.hp<=0) killCombatant(bs, target);
    return {actor:actor.id, target:target.id, buff:true, skillName:`${sk.name}：${outcome.label}`};

  if(sk.kind==='debuff_magic'){

    target.magicMod = Math.max(0.2, (target.magicMod||1)*sk.mult);

    logRatingMsg(bs, `${actor.name}は${sk.name}を使った！ ${target.name}の魔力が下がった！`);
    return {actor:actor.id, target:target.id, buff:true, skillName:sk.name};
  }
  if(sk.kind==='buff_magic'){
    actor.magicMod = (actor.magicMod||1)*sk.mult;

    if(target.hp<=0) killCombatant(bs, target);
    return {actor:actor.id, target:target.id, dmg, crit:true};
  }
  if(sk.kind==='dmg_selfbuff'){
    actor.cds[key]=3;
    if(!tryHit(actor.acc, target.eva)){ logRatingMsg(bs, `${actor.name}の${sk.name}は外れた！`); return {actor:actor.id, target:target.id, missed:true}; }
    const dmg = basicDamage(Math.round(actor.atk*sk.dmgMult), target.def);
    target.hp -= dmg;
    actor[sk.stat] = Math.round(actor[sk.stat]*sk.mult);
    logRatingMsg(bs, `${actor.name}の${sk.name}！ ${target.name}に${dmg}のダメージ、自分の${statKeyLabel(sk.stat)}が上がった！`);
    if(target.hp<=0) killCombatant(bs, target);
    return {actor:actor.id, target:target.id, dmg};
  }
  if(sk.kind==='reflect_buff'){
    actor.reflectTurns = sk.turns;
    actor.usedBuffs.push(key);
    logRatingMsg(bs, `${actor.name}は${sk.name}を使った！ プルプル状態になった！`);
    return {actor:actor.id, target:actor.id, buff:true, skillName:sk.name};
  }
  if(sk.kind==='charge_buff'){
    actor.chargingTurns = sk.chargeTurns;
    actor.chargeMult = sk.mult;
    logRatingMsg(bs, `${actor.name}は${sk.name}を使い、力をためはじめた…！`);
    return {actor:actor.id, target:actor.id, buff:true, skillName:sk.name};
  }
  if(sk.kind==='universal_dmg_status'){
    actor.cds[key]=3;
    if(!tryHit(actor.acc, target.eva)){ logRatingMsg(bs, `${actor.name}の${sk.name}は外れた！`); return {actor:actor.id, target:target.id, missed:true}; }
    const dmg = Math.max(1, Math.round(actor.atk*2 - target.def*0.3));
    target.hp -= dmg;
    target.status.poison = (target.status.poison||0)+3;
    target.status.confuse = (target.status.confuse||0)+3;
    logRatingMsg(bs, `${actor.name}の${sk.name}！ ${target.name}に${dmg}の大ダメージ！ 毒と混乱状態にした！`);
    if(target.hp<=0) killCombatant(bs, target);
    return {actor:actor.id, target:target.id, dmg, crit:true};
  }
  if(sk.kind==='universal_dmg_selfdown'){
    actor.cds[key]=3;
    if(!tryHit(actor.acc, target.eva)){ logRatingMsg(bs, `${actor.name}の${sk.name}は外れた！`); return {actor:actor.id, target:target.id, missed:true}; }
    const ratio = target.hp/target.maxHp;
    const bonus = ratio>=0.5 ? 1.4 : 1.0;
    const dmg = Math.max(1, Math.round(actor.atk*2.3*bonus - target.def*0.3));
    target.hp -= dmg;
    const selfDown = rnd(1,3);
    ['hp','atk','def','spd','eva'].forEach(k=> actor[k]=Math.max(1, actor[k]-selfDown));
    logRatingMsg(bs, `${actor.name}の${sk.name}！ ${target.name}に${dmg}の大ダメージ！ 代償で自分の全ステータスが${selfDown}下がった！`);
    if(target.hp<=0) killCombatant(bs, target);
    return {actor:actor.id, target:target.id, dmg, crit:true};
  }
  if(sk.kind==='card_draw'){
    actor.cds[key]=4;
    if(!tryHit(actor.acc, target.eva)){ logRatingMsg(bs, `${actor.name}の${sk.name}は外れた！`); return {actor:actor.id, target:target.id, missed:true}; }
    const card = pick(['heart','spade','diamond','clover','joker']);
    logRatingMsg(bs, `${actor.name}は${sk.name}！ 引いたカードは――`);
    if(card==='heart'){ actor.hp=actor.maxHp; logRatingMsg(bs, `♥ハート！ ${actor.name}のHPが全回復した！`); return {actor:actor.id, target:actor.id, buff:true, skillName:'トランププラン：♥'}; }
    if(card==='spade'){ target.status.poison=(target.status.poison||0)+3; logRatingMsg(bs, `♠スペード！ ${target.name}は毒状態になった！`); return {actor:actor.id, target:target.id, buff:true, skillName:'トランププラン：♠'}; }
    if(card==='diamond'){
      const magicPower = (actor.atk + actor.spd*1.5) * (actor.magicMod||1) * 1.5;
      const dmg = Math.max(1, Math.round(magicPower - target.def*0.3));
      target.hp -= dmg;
      logRatingMsg(bs, `♦ダイヤ！ ${target.name}に${dmg}のダメージ！`);
      if(target.hp<=0) killCombatant(bs, target);
      return {actor:actor.id, target:target.id, dmg, crit:true};
    }
    if(card==='clover'){ actor.atk=Math.round(actor.atk*1.5); logRatingMsg(bs, `♣クローバー！ 攻撃力が上がった！`); return {actor:actor.id, target:actor.id, buff:true, skillName:'トランププラン：♣'}; }
    target.hp = 0;
    logRatingMsg(bs, `🃏ジョーカー！ ${target.name}をどんな状況でも撃破した！`);
    killCombatant(bs, target);
    return {actor:actor.id, target:target.id, dmg: target.maxHp, crit:true};
  }
  return {actor:actor.id, target:null};
}
function ratingResolveAction(bs, actor, action){
  if(!actor.alive) return {actor:actor.id, target:null};
  if(actor.chargingTurns>0){
    actor.chargingTurns--;
    if(actor.chargingTurns===0){
      ['hp','atk','def','spd','eva'].forEach(k=> actor[k]=Math.round(actor[k]*(actor.chargeMult||5)));
      logRatingMsg(bs, `${actor.name}のためた力が解き放たれた！ ステータスが大幅に上昇した！`);
      return {actor:actor.id, target:actor.id, buff:true, skillName:'フワトッパ発動！'};
    }
    logRatingMsg(bs, `${actor.name}は力をためている…`);
    return {actor:actor.id, target:actor.id, buff:true, skillName:'ためている…'};
  }
  const confuseResult = ratingCheckConfuse(bs, actor);
  if(confuseResult) return confuseResult;
  let target = (action && action.target && action.target.alive) ? action.target : pick(aliveCombatants(bs).filter(c=>c.id!==actor.id));
  if(!target) return {actor:actor.id, target:null};
  if(!action || action.type==='attack'){
    if(!tryHit(actor.acc, target.eva)){ logRatingMsg(bs, `${actor.name}のこうげきは${target.name}に外れた！`); return {actor:actor.id, target:target.id, missed:true}; }
    const dmg = basicDamage(actor.atk, target.def);
    if(target.reflectTurns>0){
      target.reflectTurns--;
      actor.hp -= dmg;
      logRatingMsg(bs, `${target.name}はプルプル状態！ ${actor.name}のこうげきを跳ね返した！ ${actor.name}に${dmg}のダメージ！`);
      if(actor.hp<=0) killCombatant(bs, actor);
      return {actor:actor.id, target:actor.id, dmg};
    }
    target.hp -= dmg;
    logRatingMsg(bs, `${actor.name}のこうげき！ ${target.name}に${dmg}のダメージ！`);
    if(target.hp<=0) killCombatant(bs, target);
    return {actor:actor.id, target:target.id, dmg};
  }
  const sk = SKILLS[action.key];
  if(!sk) return {actor:actor.id, target:target.id};
  return ratingApplySkill(bs, actor, target, sk, action.key);
}
function ratingTickCooldowns(bs){
  bs.combatants.forEach(c=>{
    if(!c.alive) return;
    Object.keys(c.cds).forEach(k=>{ if(c.cds[k]>0) c.cds[k]--; });
    if(c.status && c.status.poison>0){
      const dmg = Math.max(1, Math.round(c.maxHp*0.07));
      c.hp -= dmg; c.status.poison--;
      logRatingMsg(bs, `${c.name}は毒のダメージを受けた！ ${dmg}のダメージ！`);
      if(c.hp<=0) killCombatant(bs, c);
    }
  });
}
function ratingCheckOver(bs){
  const alive = aliveCombatants(bs);
  if(alive.length<=1){
    bs.over = true;
    const me = bs.combatants.find(c=>c.isPlayer);
    bs.result = (alive[0] && alive[0].isPlayer) ? 'win' : 'lose';
    bs.survivalRank = bs.eliminationOrder.includes(me.id) ? (5 - bs.eliminationOrder.indexOf(me.id)) : 1;
    return true;
  }
  return false;
}
async function ratingPlayRound(bs){
  const order = aliveCombatants(bs).sort((a,b)=> b.spd-a.spd);
  const beat = bs.speed===2 ? 260 : 520;
  for(const actor of order){
    if(bs.skipped || ratingBattleState!==bs) return;
    if(!actor.alive) continue;
    if(aliveCombatants(bs).length<=1) break;
    const action = ratingDecideAction(bs, actor);
    const result = ratingResolveAction(bs, actor, action);
    bs.fx = result;
    render();
    await wait(beat);
    if(bs.skipped || ratingBattleState!==bs) return;
  }
  bs.fx = null;
  ratingTickCooldowns(bs);
  ratingCheckOver(bs);
  render();
}
async function ratingAutoLoop(){
  const bs = ratingBattleState;
  if(!bs || bs.over || bs.skipped) return;
  await ratingPlayRound(bs);
  if(ratingBattleState===bs && !bs.over && !bs.skipped){
    bs.timer = setTimeout(()=>ratingAutoLoop(), bs.speed===2?200:420);
  }
}
function ratingSkipToEnd(){
  const bs = ratingBattleState;
  if(!bs || bs.over) return;
  bs.skipped = true;
  clearTimeout(bs.timer);
  bs.fx = null;
  let guard=0;
  while(!bs.over && guard<500){
    const order = aliveCombatants(bs).sort((a,b)=>b.spd-a.spd);
    for(const actor of order){
      if(!actor.alive) continue;
      if(aliveCombatants(bs).length<=1) break;
      const action = ratingDecideAction(bs, actor);
      ratingResolveAction(bs, actor, action);
    }
    ratingTickCooldowns(bs);
    if(ratingCheckOver(bs)) break;
    guard++;
  }
  render();
}
function formatDateJP(d){ return `${d.getMonth()+1}/${d.getDate()}`; }
function buildRatingRanking(bs){
  const ranking = [];
  const survivor = aliveCombatants(bs)[0];
  if(survivor) ranking.push(survivor);
  for(let i=bs.eliminationOrder.length-1;i>=0;i--){
    const c = bs.combatants.find(x=>x.id===bs.eliminationOrder[i]);
    if(c) ranking.push(c);
  }
  return ranking.map((c,i)=>({
    name:c.name, speciesId:c.speciesId, power:c.basePower, rank:i+1, isPlayer:c.isPlayer,
  }));
}
function finishRatingBattle(){
  const bs = ratingBattleState;
  clearTimeout(bs.timer);
  account.lastRatingResult = { date: formatDateJP(new Date()), ranking: buildRatingRanking(bs) };
  if(bs.result==='win'){
    account.ratingWins++;
    account.medals += 40;
    toast('レーティングマッチ勝利！ 🪙+40');
  }else{
    account.ratingLosses++;
    toast(`レーティングマッチ終了…生存${bs.survivalRank}位`);
  }
  saveAccount();
  ratingBattleState = null;
  S.viewMode = 'rating';
  saveGame();
  render();
}
function renderRatingBattle(){
  const bs = ratingBattleState;
  const wrap = el(`<div class="battle-fullscreen rating-mode"></div>`);
  const topBar = el(`<div class="battle-top-bar">
    <span class="tag heart">🥊 レーティングマッチ</span>
    <span class="tiny dim">残り${aliveCombatants(bs).length}体</span>
  </div>`);
  wrap.appendChild(topBar);

  const arena = el(`<div class="battle-arena-full"><div class="rating-row"></div></div>`);
  const row = arena.querySelector('.rating-row');
  const fx = bs.fx;
  const order = bs.displayOrder.map(id=> bs.combatants.find(c=>c.id===id));
  const slotOf = {}; order.forEach((c,i)=>{ slotOf[c.id]=i; });

  order.forEach(c=>{
    const ratio = clamp(c.hp/c.maxHp, 0, 1);
    const isActorFx = fx && fx.actor===c.id && !fx.buff;
    const isTargetFx = fx && fx.target===c.id;
    const figClass = [
      isActorFx ? 'rating-attack-pose' : '',
      (isTargetFx && fx.buff) ? (fx.actor===fx.target?'buff-glow':'debuff-glow') : '',
      (isTargetFx && !fx.buff) ? 'hit-shake' : '',
    ].join(' ');
    let dmgHTML = '';
    if(isTargetFx){
      if(fx.buff) dmgHTML = `<div class="dmg-float buff">${fx.skillName||''}</div>`;
      else if(fx.missed) dmgHTML = `<div class="dmg-float miss">MISS</div>`;
      else if(typeof fx.dmg==='number') dmgHTML = `<div class="dmg-float ${fx.crit?'crit':''}">-${fx.dmg}</div>`;
    }
    row.appendChild(el(`<div class="rating-slot ${c.alive?'':'ko'} ${c.isPlayer?'is-player':''}">
      <div class="hp-pill mini">
        <span class="pname">${c.isPlayer?'★':''}${c.name}</span>
        <div class="bar"><div class="bar-fill ${hpBarClass(ratio)}" style="width:${ratio*100}%"></div></div>
        <span class="pnum">${Math.max(0,c.hp)}</span>
      </div>
      <div class="mon-figure ${figClass}">${monsterSVG(c.mon,c.isPlayer?66:50)}${dmgHTML}</div>
    </div>`));
  });

  /* だれがだれを攻撃しているか一目でわかるように、攻撃側→対象へ飛ぶエフェクトを表示 */
  if(fx && fx.actor && fx.target && fx.actor!==fx.target && !fx.buff && slotOf[fx.actor]!==undefined && slotOf[fx.target]!==undefined){
    const actorC = bs.combatants.find(c=>c.id===fx.actor);
    const fromPct = (slotOf[fx.actor]+0.5) / order.length * 100;
    const toPct = (slotOf[fx.target]+0.5) / order.length * 100;
    const atkfx = getAttackFx(actorC && actorC.speciesId);
    row.appendChild(el(`<div class="rating-fx-icon" style="--from:${fromPct}%; --to:${toPct}%; --fxcolor:${atkfx.color};">${atkfx.icon}</div>`));
  }

  if(bs.over && bs.result==='win'){
    const meC = bs.combatants.find(c=>c.isPlayer);
    row.appendChild(el(`<div class="win-banner">${meC.mon.name} WIN!!!</div>`));
  }
  wrap.appendChild(arena);

  const caption = el(`<div class="battle-caption-bar">${bs.log.slice(-2).map(l=>`<div class="cap-line">${l}</div>`).join('')}</div>`);
  wrap.appendChild(caption);

  if(!bs.over){
    const controls = el(`<div class="battle-controls-bar">
      <div class="auto-badge"><span class="dot"></span>5体入り乱れ中…</div>
      <div style="display:flex; gap:8px;">
        <button class="btn secondary" id="rSpeedBtn" style="padding:8px 12px;">${bs.speed===2?'⏩ 2倍速':'▶ 通常速度'}</button>
        <button class="btn secondary" id="rSkipBtn" style="padding:8px 12px;">結果までスキップ</button>
      </div>
    </div>`);
    wrap.appendChild(controls);
    controls.querySelector('#rSpeedBtn').onclick = ()=>{ bs.speed = bs.speed===2?1:2; render(); };
    controls.querySelector('#rSkipBtn').onclick = ()=> ratingSkipToEnd();
  }else if(bs.result==='win'){
    if(!bs.winBannerScheduled){
      bs.winBannerScheduled = true;
      sfxWin();
      setTimeout(()=>{ if(ratingBattleState===bs) finishRatingBattle(); }, 2200);
    }
  }else{
    const result = el(`<div class="battle-result-bar">
      <h2 style="color:var(--crimson); margin:0;">生存${bs.survivalRank}位</h2>
      <p class="small dim" style="margin-top:6px;">またすぐに挑める強さを目指そう。</p>
      <button class="btn block" id="rContinueBtn" style="margin-top:12px;">レーティング画面へ</button>
    </div>`);
    wrap.appendChild(result);
    wrap.querySelector('#rContinueBtn').onclick = ()=> finishRatingBattle();
  }
  return wrap;
}

/* ---- ハントタブ（派遣隊：最大3体） ---- */
function renderHuntTab(){
  huntSquadSelection = huntSquadSelection.filter(id=> account.roster.some(m=>m.id===id));
  const wrap = el(`<div style="display:flex; flex-direction:column; gap:12px;"></div>`);
  wrap.appendChild(el(`<h2 style="color:var(--gold-hi); font-size:1.15rem;">🏹 ハント（派遣隊）</h2>`));
  wrap.appendChild(el(`<p class="small dim" style="line-height:1.7;">育てたモンスターの中から最大3体を選んで派遣しよう。選んだ仲間の力を合わせて、暴走したモンスターに挑む。</p>`));

  const pickWrap = el(`<div style="display:flex; flex-direction:column; gap:8px;"></div>`);
  wrap.appendChild(pickWrap);
  function refreshPick(){
    pickWrap.innerHTML = '';
    if(account.roster.length===0){
      pickWrap.appendChild(el(`<div class="card center-text"><p class="small dim">まだ育成を終えたモンスターがいません。</p></div>`));
      return;
    }
    account.roster.forEach(m=>{
      const sp = STARTERS[m.speciesId];
      const selected = huntSquadSelection.includes(m.id);
      const row = el(`<button class="skill-row" style="width:100%; text-align:left; border-color:${selected?'var(--gold)':'rgba(255,255,255,.08)'}; ${selected?'background:rgba(232,171,69,.14);':''}">
        <div class="mon-avatar-wrap" style="padding:0;">${monsterSVG(sp||{shape:'kaiju',colorA:'#888',colorB:'#444'},44)}</div>
        <div class="info"><div class="name">${m.name}</div><div class="desc">HP${m.stats.hp}・攻${m.stats.atk}・防${m.stats.def}・速${m.stats.spd}・回${m.stats.eva}</div></div>
        ${selected?'<span class="tag gold">選択中</span>':''}
      </button>`);
      row.onclick = ()=>{
        if(selected){ huntSquadSelection = huntSquadSelection.filter(id=>id!==m.id); }
        else{
          if(huntSquadSelection.length>=3){ toast('派遣は最大3体まで'); return; }
          huntSquadSelection.push(m.id);
        }
        refreshPick();
        updateGoBtn();
      };
      pickWrap.appendChild(row);
    });
  }

  const attemptNum = account.huntAttempts + 1;
  const cost = huntCost(attemptNum);
  const goCard = el(`<div class="card">
    <p class="small" style="margin-bottom:6px;">次の挑戦：<b style="color:var(--gold-hi);">${attemptNum}回目</b>　挑戦${account.huntAttempts}回・勝利${account.huntWins}回</p>
    <p class="small dim" style="margin-bottom:12px;">費用：${cost===0?'初回無料':'🪙'+cost}</p>
    <button class="btn block" id="huntGoBtn" style="padding:16px;">ハントに出発する</button>
  </div>`);
  wrap.appendChild(goCard);
  const goBtn = goCard.querySelector('#huntGoBtn');
  function updateGoBtn(){
    goBtn.disabled = huntSquadSelection.length===0 || account.medals<cost;
  }

  wrap.appendChild(el(`<div class="card"><p class="tiny dim" style="line-height:1.7;">出現レアリティー：ノーマル50%／パープル30%／ゴールド19%／レインボー1%<br>レアリティーが高いほど敵は強いが、報酬も豪華になる。</p></div>`));

  refreshPick();
  updateGoBtn();

  goBtn.onclick = ()=>{
    if(huntSquadSelection.length===0){ toast('派遣するモンスターを選ぼう'); return; }
    if(account.medals<cost){ toast('メダルが足りない…'); return; }
    account.medals -= cost;
    account.huntAttempts += 1;
    const squad = account.roster.filter(m=>huntSquadSelection.includes(m.id));
    const combined = combineSquadStats(squad);
    const rarity = rollHuntRarity();
    const mob = pick(Object.values(HUNT_MOBS));
    const enemy = {
      name:`暴走${mob.name}（${rarity.label}）`,
      colorA:mob.colorA, colorB:mob.colorB, shape:mob.shape,
      hp:Math.round(mob.hp*rarity.mult), maxHp:Math.round(mob.hp*rarity.mult),
      atk:Math.round(mob.atk*rarity.mult), def:Math.round(mob.def*rarity.mult),
      eva:mob.eva, spd:Math.round(mob.spd*rarity.mult),
      skills:[],
    };
    saveAccount();
    const leadSpecies = STARTERS[squad[0].speciesId] || {shape:'kaiju', colorA:'#888', colorB:'#444'};
    startBattle({type:'hunt', rarity}, enemy, 'none', {
      name: squad.map(s=>s.name).join('・'),
      mon: leadSpecies,
      stats: combined,
    });
  };

  return wrap;
}
function combineSquadStats(squad){
  const sum = {hp:0,atk:0,def:0,spd:0,eva:0};
  squad.forEach(m=>{ ['hp','atk','def','spd','eva'].forEach(k=> sum[k]+=(m.stats[k]||0)); });
  const n = squad.length;
  sum.spd = Math.round(sum.spd/n);
  sum.eva = Math.round(sum.eva/n);
  return sum;
}

    let payload;

        toast('復元しました');
        render();
      },
    });
  };

  return wrap;
}

/* =========================================================================
   ローディング画面（起動時のみ）
   ========================================================================= */
function showLoadingScreen(durationMs){
  const overlay = document.createElement('div');
  overlay.id = 'loadingOverlay';
  const tips = ['育成データを読み込み中…','コロシアムの灯りをともしています…','モンスターたちを起こしています…','闘技場の砂をならしています…'];
  overlay.innerHTML = `<div class="loading-wrap">
    <div class="loading-emblem">🏛️</div>
    <div class="loading-title">コロシアムモンスターズ</div>
    <div class="loading-bar-track"><div class="loading-bar-fill" id="loadingBarFill"></div></div>
    <div class="loading-tip" id="loadingTip">${tips[0]}</div>
  </div>`;
  document.body.appendChild(overlay);
  const fill = overlay.querySelector('#loadingBarFill');
  const tipEl = overlay.querySelector('#loadingTip');
  let tipI = 0;
  const tipTimer = setInterval(()=>{ tipI=(tipI+1)%tips.length; if(tipEl) tipEl.textContent = tips[tipI]; }, 1400);
  const start = Date.now();
  function raf(){
    if(!document.getElementById('loadingOverlay')) return;
    const elapsed = Date.now()-start;
    const pct = Math.min(100, (elapsed/durationMs)*100);
    if(fill) fill.style.width = pct+'%';
    if(elapsed<durationMs){ requestAnimationFrame(raf); }
  }
  requestAnimationFrame(raf);
  return { overlay, tipTimer };
}
function hideLoadingScreen(handle){
  clearInterval(handle.tipTimer);
  handle.overlay.style.transition = 'opacity .4s ease';
  handle.overlay.style.opacity = '0';
  setTimeout(()=> handle.overlay.remove(), 420);
}

/* =========================================================================
   boot
   ========================================================================= */
(async function boot(){
  const durationMs = rnd(4000,8000);
  const loadingHandle = showLoadingScreen(durationMs);
  const startTime = Date.now();
  await loadGame();
  const elapsed = Date.now()-startTime;
  if(elapsed < durationMs){ await new Promise(res=>setTimeout(res, durationMs-elapsed)); }
  hideLoadingScreen(loadingHandle);
  render();
})();
